<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firebase Autentifikatsiya</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #08090d;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
      background: #10121a;
      border: 1px solid #1f2334;
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .logo-badge {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin: 0 auto 16px;
      background: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 24px;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.45);
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 24px;
    }

    /* Google Button */
    .btn-google {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
      color: #0f172a;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-google:hover {
      background: #f8fafc;
      transform: translateY(-1px);
    }

    .btn-google:active {
      transform: translateY(0);
    }

    .btn-google svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: #64748b;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #1e293b;
    }

    .divider span {
      padding: 0 12px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: #090a10;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 18px;
      border: 1px solid #1e293b;
    }

    .tab-btn {
      flex: 1;
      padding: 9px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: #ef4444;
      color: #ffffff;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      background: #090a10;
      border: 1px solid #1e293b;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #ef4444;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      background: #ef4444;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s ease;
    }

    .btn-submit:hover {
      background: #dc2626;
    }

    .btn-submit:disabled,
    .btn-google:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Alerts */
    .alert {
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      text-align: left;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
    }

    /* Dashboard (Logged in state) */
    #dashboard-view {
      display: none;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid #ef4444;
      margin: 0 auto 16px;
      object-fit: cover;
    }

    .btn-logout {
      width: 100%;
      margin-top: 20px;
      padding: 11px;
      border-radius: 10px;
      background: #1e293b;
      color: #ffffff;
      border: 1px solid #334155;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-logout:hover {
      background: #334155;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    
    <!-- 1. Kirish va Ro'yxatdan o'tish ekrani -->
    <div id="auth-view">
      <div class="logo-badge">M</div>
      <h1>Xush kelibsiz</h1>
      <p class="subtitle">Platformaga kirish yoki yangi hisob yaratish</p>

      <!-- Xabarlar chiqadigan bloklar -->
      <div id="error-alert" class="alert alert-error"></div>
      <div id="success-alert" class="alert alert-success"></div>

      <!-- Google bilan kirish tugmasi -->
      <button type="button" class="btn-google" id="btn-google-auth">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
        </svg>
        <span>Google hisobingiz bilan kiring</span>
      </button>

      <div class="divider">
        <span>YOKI</span>
      </div>

      <!-- Tablar: Kirish / Ro'yxatdan o'tish -->
      <div class="tabs">
        <button type="button" class="tab-btn active" id="tab-login">Kirish</button>
        <button type="button" class="tab-btn" id="tab-register">Ro‘yxatdan o‘tish</button>
      </div>

      <!-- Login / Parol formasi -->
      <form id="email-password-form">
        <!-- Ro'yxatdan o'tishda ism so'raladi -->
        <div class="form-group" id="name-group" style="display: none;">
          <label for="input-name">Foydalanuvchi nomi</label>
          <input type="text" id="input-name" placeholder="Ismingizni kiriting" autocomplete="name" />
        </div>

        <div class="form-group">
          <label for="input-email">Email manzil</label>
          <input type="email" id="input-email" required placeholder="nomi@namuna.uz" autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="input-password">Parol</label>
          <input type="password" id="input-password" required placeholder="Kamida 6 ta belgi" autocomplete="current-password" />
        </div>

        <button type="submit" class="btn-submit" id="btn-submit-action">Kirish</button>
      </form>
    </div>

    <!-- 2. Tizimga muvaffaqiyatli kirgandagi holat (Dashboard / Profil) -->
    <div id="dashboard-view">
      <img id="user-avatar" class="avatar" src="" alt="Foydalanuvchi rasmi" />
      <h2 id="user-display-name" style="font-size: 20px; font-weight: 800; margin-bottom: 4px;"></h2>
      <p id="user-display-email" style="font-size: 13px; color: #94a3b8; margin-bottom: 16px;"></p>
      
      <div style="background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.35); color: #86efac; padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; display: inline-block;">
        ✓ Foydalanuvchi tizimda faol
      </div>

      <button type="button" class="btn-logout" id="btn-logout">Chiqish (Logout)</button>
    </div>

  </div>

  <!-- FIREBASE AUTH JAVASCRIPT KODI (MODULAR SDK v10/v11) -->
  <script type="module">
    // 1. Firebase SDK'ni CDN orqali import qilish (Hech qanday npm install shart emas)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword,
      updateProfile,
      signOut,
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // 2. Firebase Konfiguratsiyasi (O'zingizning Firebase Console'dagi kalitlaringiz bilan almashtiring)
    const firebaseConfig = {
      apiKey: "AIzaSyD-SIZNING_FIREBASE_API_KEYINGIZ",
      authDomain: "loyihangiz.firebaseapp.com",
      projectId: "loyihangiz",
      storageBucket: "loyihangiz.appspot.com",
      messagingSenderId: "123456789012",
      appId: "1:123456789012:web:abcdef123456"
    };

    // Firebase ilovasini initsializatsiya qilamiz
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    // DOM Elementlari
    const authView = document.getElementById('auth-view');
    const dashboardView = document.getElementById('dashboard-view');
    const btnGoogleAuth = document.getElementById('btn-google-auth');
    const emailPasswordForm = document.getElementById('email-password-form');
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const nameGroup = document.getElementById('name-group');
    const btnSubmitAction = document.getElementById('btn-submit-action');
    const errorAlert = document.getElementById('error-alert');
    const successAlert = document.getElementById('success-alert');
    const btnLogout = document.getElementById('btn-logout');

    let currentMode = 'login'; // 'login' yoki 'register'

    // Xabarlarni ko'rsatuvchi yordamchi funksiyalar
    function showError(msg) {
      successAlert.style.display = 'none';
      errorAlert.textContent = msg;
      errorAlert.style.display = 'block';
    }

    function showSuccess(msg) {
      errorAlert.style.display = 'none';
      successAlert.textContent = msg;
      successAlert.style.display = 'block';
    }

    function clearAlerts() {
      errorAlert.style.display = 'none';
      successAlert.style.display = 'none';
    }

    // Tablarni almashtirish (Kirish <=> Ro'yxatdan o'tish)
    tabLogin.addEventListener('click', () => {
      currentMode = 'login';
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      nameGroup.style.display = 'none';
      btnSubmitAction.textContent = 'Kirish';
      clearAlerts();
    });

    tabRegister.addEventListener('click', () => {
      currentMode = 'register';
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      nameGroup.style.display = 'block';
      btnSubmitAction.textContent = 'Ro‘yxatdan o‘tish';
      clearAlerts();
    });

    // 3. Google hisobi bilan kirish (signInWithPopup)
    btnGoogleAuth.addEventListener('click', async () => {
      clearAlerts();
      btnGoogleAuth.disabled = true;

      try {
        const result = await signInWithPopup(auth, googleProvider);
        const user = result.user;
        showSuccess(`Xush kelibsiz, ${user.displayName || user.email}!`);
        // Agar boshqa sahifaga yo'naltirmoqchi bo'lsangiz:
        // window.location.href = '/dashboard.html';
      } catch (err) {
        console.error("Google Auth xatosi:", err);
        if (err.code === 'auth/popup-closed-by-user') {
          showError("Google bilan kirish oynasi yopib qo‘yildi.");
        } else if (err.code === 'auth/cancelled-popup-request') {
          showError("So'rov bekor qilindi.");
        } else if (err.code === 'auth/unauthorized-domain') {
          showError("Xatolik: Ushbu domen Firebase Console > Authorized Domains ro'yxatiga qo'shilmagan.");
        } else {
          showError("Google orqali kirishda xatolik: " + err.message);
        }
      } finally {
        btnGoogleAuth.disabled = false;
      }
    });

    // 4. Login va Parol orqali Kirish / Ro'yxatdan o'tish funksiyasi
    emailPasswordForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlerts();

      const email = document.getElementById('input-email').value.trim();
      const password = document.getElementById('input-password').value;
      const name = document.getElementById('input-name').value.trim();

      btnSubmitAction.disabled = true;

      if (currentMode === 'register') {
        // RO'YXATDAN O'TISH
        try {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;

          // Agar foydalanuvchi ism kiritgan bo'lsa, profilga saqlaymiz
          if (name) {
            await updateProfile(user, { displayName: name });
          }

          showSuccess("Muvaffaqiyatli ro'yxatdan o'tdingiz!");
          // window.location.href = '/';
        } catch (err) {
          console.error("Ro'yxatdan o'tish xatosi:", err);
          if (err.code === 'auth/email-already-in-use') {
            showError("Ushbu email bilan allaqachon ro‘yxatdan o‘tilgan.");
          } else if (err.code === 'auth/weak-password') {
            showError("Parol juda qisqa (kamida 6 ta belgi kiriting).");
          } else if (err.code === 'auth/invalid-email') {
            showError("Email manzili noto‘g‘ri kiritildi.");
          } else {
            showError("Ro'yxatdan o'tishda xatolik: " + err.message);
          }
        } finally {
          btnSubmitAction.disabled = false;
        }

      } else {
        // TIZIMGA KIRISH (LOGIN)
        try {
          await signInWithEmailAndPassword(auth, email, password);
          showSuccess("Tizimga muvaffaqiyatli kirdingiz!");
          // window.location.href = '/';
        } catch (err) {
          console.error("Kirish xatosi:", err);
          if (
            err.code === 'auth/invalid-credential' || 
            err.code === 'auth/user-not-found' || 
            err.code === 'auth/wrong-password'
          ) {
            showError("Email yoki parol noto‘g‘ri kiritildi.");
          } else if (err.code === 'auth/too-many-requests') {
            showError("Haddan tashqari ko‘p urinish qilindi. Biroz kuting.");
          } else {
            showError("Kirishda xatolik: " + err.message);
          }
        } finally {
          btnSubmitAction.disabled = false;
        }
      }
    });

    // 5. Chiqish (Sign Out)
    btnLogout.addEventListener('click', async () => {
      try {
        await signOut(auth);
        showSuccess("Tizimdan muvaffaqiyatli chiqdingiz.");
      } catch (err) {
        showError("Chiqishda xatolik yuz berdi: " + err.message);
      }
    });

    // 6. Foydalanuvchi holatini real vaqtda kuzatish (onAuthStateChanged)
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Foydalanuvchi tizimga kirgan:
        authView.style.display = 'none';
        dashboardView.style.display = 'block';

        document.getElementById('user-display-name').textContent = user.displayName || 'Foydalanuvchi';
        document.getElementById('user-display-email').textContent = user.email;
        document.getElementById('user-avatar').src = user.photoURL || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80';

        console.log("Foydalanuvchi autentifikatsiyadan o'tdi:", user);
        
        // Agar foydalanuvchi kirishi bilan boshqa sahifaga (masalan, bosh sahifaga) yo'naltirmoqchi bo'lsangiz:
        // window.location.href = '/';
      } else {
        // Foydalanuvchi kirmagan:
        authView.style.display = 'block';
        dashboardView.style.display = 'none';
        console.log("Foydalanuvchi tizimga kirmagan.");
      }
    });
  </script>

</body>
</html>
